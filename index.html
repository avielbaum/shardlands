<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#09070f">
<title>Aetherium: Shardlands</title>
<style>
  :root { --brass: #c99a48; --brass-hi: #f0d48a; --cyan: #3fe6ff; --ivory: #f6e7c1; --obsidian: #09070f; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--obsidian); color: var(--ivory);
    font-family: Georgia, 'Times New Roman', serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #view, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #view { image-rendering: pixelated; }
  #hud { pointer-events: none; }
  body.free-look #view { cursor: crosshair; }
  #boot-error { position: fixed; top: 40%; width: 100%; text-align: center; color: var(--brass-hi); z-index: 50; letter-spacing: .1em; }

  .brass-btn {
    font: 600 13px Georgia, serif; color: var(--ivory); cursor: pointer; background: linear-gradient(#2a1d0b, #150f07);
    border: 2px solid var(--brass); border-radius: 6px; padding: 6px 11px; letter-spacing: .03em; min-height: 32px;
  }
  .brass-btn:hover, .brass-btn:focus-visible { border-color: var(--brass-hi); outline: none; color: #fff; }
  .brass-btn:disabled { opacity: .4; cursor: not-allowed; }
  #utils { position: fixed; top: 52px; right: 10px; display: flex; gap: 6px; z-index: 5; }
  body.touch #utils { top: auto; right: auto; bottom: 8px; left: 8px; }
  body.touch #utils .brass-btn { font-size: 11px; padding: 4px 7px; min-height: 26px; }

  #hotbar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 5px; z-index: 4; }
  body.touch #hotbar { bottom: auto; top: 34px; }
  body.touch #hotbar .slot { width: 46px; height: 46px; }
  #hotbar .slot {
    position: relative; width: 50px; height: 50px; padding: 0; cursor: pointer;
    background: rgba(12, 8, 20, .75); border: 2px solid var(--brass); border-radius: 6px;
  }
  #hotbar .slot.sel { border-color: var(--cyan); box-shadow: 0 0 10px rgba(63, 230, 255, .5); }
  #hotbar .key { position: absolute; left: 3px; top: 1px; font: 600 10px Georgia, serif; color: var(--brass-hi); }
  .icon { image-rendering: pixelated; display: block; margin: auto; }

  #tutorial {
    position: fixed; top: 48px; left: 50%; transform: translateX(-50%); width: min(560px, 92vw); z-index: 6;
    background: rgba(12, 8, 20, .82); border: 2px solid var(--cyan); border-radius: 10px; padding: 8px 12px 10px;
    box-shadow: 0 0 16px rgba(63, 230, 255, .25); pointer-events: none;
  }
  #tutorial.hidden { display: none; }
  #tutorial .tut-head { display: flex; align-items: center; gap: 8px; }
  #tutorial #tut-step { flex: 1; font: 600 13px Georgia, serif; color: var(--cyan); letter-spacing: .04em; }
  #tutorial #tut-end { pointer-events: auto; font-size: 11px; padding: 4px 8px; min-height: 26px; }
  #tutorial p { margin: 4px 0 0; font-size: 13px; }
  body.touch #tutorial { top: 146px; left: 70px; right: 8px; width: auto; transform: none; }
  #modal {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 12px;
    background: radial-gradient(ellipse at center, rgba(9, 7, 15, .5), rgba(9, 7, 15, .88));
  }
  #modal.hidden { display: none; }
  .panel {
    width: min(920px, 100%); max-height: 100%; overflow: auto; padding: 16px 18px; user-select: text;
    background: linear-gradient(rgba(30, 21, 9, .95), rgba(12, 9, 18, .97)); border: 3px double var(--brass); border-radius: 12px;
    box-shadow: 0 0 40px rgba(63, 230, 255, .1), inset 0 0 30px rgba(0, 0, 0, .6);
  }
  .panel.title { width: min(620px, 100%); text-align: center; }
  .panel-head { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(201, 154, 72, .4); margin-bottom: 10px; }
  .panel-head h2 { flex: 1; margin: 4px 0 8px; font-size: 20px; color: var(--brass-hi); letter-spacing: .06em; }
  h1 { margin: 0; font-size: clamp(30px, 7vw, 48px); letter-spacing: .14em; color: var(--brass-hi); text-shadow: 0 0 18px rgba(240, 212, 138, .35); }
  h3 { margin: 0 0 12px; letter-spacing: .5em; color: var(--cyan); font-weight: normal; }
  h4 { margin: 12px 0 6px; color: var(--brass-hi); letter-spacing: .05em; }
  p { line-height: 1.5; margin: 6px 0; font-size: 14px; }
  hr { border: 0; border-top: 1px solid rgba(201, 154, 72, .35); }
  .small { font-size: 12px; opacity: .8; }
  .warn { color: #ff9a7a; font-size: 12px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .volumes { margin-top: 10px; }
  .panel.create { width: min(1080px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; }
  .create .name-input { flex: 1; min-width: 0; font: inherit; color: var(--ivory); background: rgba(9,7,15,0.8); border: 1px solid var(--brass); border-radius: 4px; padding: 6px 8px; }
  .create .tab.on { border-color: var(--brass-hi); color: #fff; box-shadow: inset 0 -2px 0 var(--brass-hi); }
  .create-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; margin: 10px 0; }
  .create .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .create .card { text-align: left; font: inherit; color: var(--ivory); background: rgba(20,14,30,0.85); border: 1px solid rgba(201,154,72,0.45); border-radius: 6px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
  .create .card.sel { border-color: var(--brass-hi); background: rgba(60,44,20,0.85); box-shadow: 0 0 10px rgba(240,212,138,0.35); }
  .create .card:focus-visible, .create .answer:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .create .answer { text-align: left; display: flex; align-items: center; gap: 10px; white-space: normal; }
  .create .summary { background: rgba(9,7,15,0.75); border: 1px solid rgba(201,154,72,0.5); border-radius: 6px; padding: 10px; align-self: start; position: sticky; top: 0; }
  .create .dim, .profile .dim { opacity: 0.7; }
  .create .fated { color: var(--brass-hi); }
  .emblem { flex: none; border-radius: 50%; }
  .profile { margin-bottom: 10px; }
  @media (max-width: 760px) { .create-grid { grid-template-columns: 1fr; } .create .summary { position: static; } .create .cards { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); } }
  .volumes input[type=range] { accent-color: var(--brass-hi); width: 55%; }
  .row.wrap { flex-wrap: wrap; }
  .panel.title .row { justify-content: center; margin: 12px 0; }
  .col { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .grow { flex: 1; }
  .item-row { padding: 4px 0; border-bottom: 1px solid rgba(201, 154, 72, .15); }
  .tabs { margin-bottom: 8px; }
  .controls { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; text-align: left; font-size: 13px; max-width: 470px; margin: 10px auto; }
  .controls b { color: var(--brass-hi); }
  body.touch .desktop-only { display: none; }
  body:not(.touch) .touch-only { display: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, 54px); gap: 5px; }
  .cell {
    position: relative; width: 54px; height: 54px; padding: 0; cursor: pointer;
    background: rgba(12, 8, 20, .7); border: 2px solid rgba(201, 154, 72, .5); border-radius: 6px;
  }
  .cell.eq { border-color: var(--brass-hi); }
  .cell.sel { border-color: var(--cyan); box-shadow: 0 0 8px rgba(63, 230, 255, .5); }
  .qty { position: absolute; right: 3px; bottom: 1px; font: 600 11px Georgia, serif; color: var(--ivory); text-shadow: 0 0 3px #000; }
  .empty-slot { display: inline-block; width: 28px; height: 28px; border: 1px dashed rgba(201, 154, 72, .5); border-radius: 4px; }
  .bar { height: 6px; background: rgba(255, 255, 255, .1); border-radius: 3px; margin: 3px 0; }
  .bar > div { height: 100%; background: var(--cyan); border-radius: 3px; }
  .quest { padding: 6px 0; border-bottom: 1px solid rgba(201, 154, 72, .2); }
  .dlg { display: grid; grid-template-columns: 200px 1fr; gap: 16px; }
  .dlg-side { text-align: center; }
  .portrait { display: block; margin: 0 auto 6px; width: 112px; height: 112px; border: 1px solid var(--brass); border-radius: 6px; background: radial-gradient(circle at 42% 34%, #3a2c22 0%, #17121a 60%, #09070d 100%); box-shadow: inset 0 0 18px rgba(0,0,0,0.8); }
  .topics { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
  .dlg-text { font-size: 15px; min-height: 80px; white-space: pre-line; background: rgba(0, 0, 0, .25); padding: 10px; border-radius: 6px; }
  .dlg-main .col { margin: 10px 0; }
  .book { font-size: 15px; white-space: pre-line; }
  .map-wrap { position: relative; margin: auto; }
  .map, .map-overlay { position: absolute; inset: 0; image-rendering: pixelated; border: 1px solid var(--brass); }
  .map-overlay { cursor: crosshair; border: 0; }
  .close { min-width: 34px; }
  @media (max-width: 640px) { .cols, .dlg { grid-template-columns: 1fr; } }

  #touch { display: none; }
  body.touch #touch { display: block; }
  .zone { position: fixed; bottom: 0; height: 55%; touch-action: none; z-index: 3; }
  #zone-move { left: 0; width: 45%; }
  #zone-look { right: 0; width: 55%; }
  .stick-base {
    position: absolute; left: 90px; top: 60%; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
    border: 3px solid rgba(201, 154, 72, .55); background: rgba(9, 7, 15, .35); pointer-events: none; opacity: .5;
  }
  #zone-look .stick-base { left: 60%; }
  .stick-base.active { opacity: 1; }
  .stick-knob {
    position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--brass-hi), var(--brass) 55%, #3d2a0c);
  }
  #actions { position: fixed; right: 10px; bottom: 26%; display: grid; grid-template-columns: repeat(3, 58px); gap: 8px; z-index: 4; }
  #actions button, #drawer button {
    width: 58px; height: 58px; border-radius: 50%; touch-action: none; font: 700 10px Georgia, serif; color: var(--ivory);
    background: radial-gradient(circle at 40% 35%, #3a2a12, #120c06); border: 3px solid var(--brass);
  }
  #actions button[data-act=attack] { border-color: var(--cyan); }
  #drawer { position: fixed; left: 10px; top: 170px; display: flex; flex-direction: column; gap: 6px; z-index: 4; }
  #drawer button { width: 50px; height: 50px; border-radius: 10px; }
</style>
</head>
<body>
  <canvas id="view" aria-label="Aetherium: Shardlands game view"></canvas>
  <canvas id="hud" aria-hidden="true"></canvas>
  <div id="boot-error" role="alert">Forging the Shardlands…</div>

  <div id="utils">
    <button id="mute" class="brass-btn" type="button">Sound: on</button>
    <button id="touch-toggle" class="brass-btn" type="button">Touch HUD</button>
    <button class="brass-btn" type="button" data-act="pause">Menu</button>
  </div>
  <div id="hotbar" aria-label="Hotbar"></div>
  <div id="tutorial" class="hidden" role="status" aria-live="polite">
    <div class="tut-head"><span id="tut-step"></span><button id="tut-end" class="brass-btn" type="button">End Tutorial [Esc]</button></div>
    <p id="tut-text"></p>
  </div>

  <div id="touch">
    <div id="zone-move" class="zone"><div class="stick-base"><div class="stick-knob"></div></div></div>
    <div id="zone-look" class="zone"><div class="stick-base"><div class="stick-knob"></div></div></div>
    <div id="actions">
      <button type="button" data-act="interact">USE</button>
      <button type="button" data-act="jump">JUMP</button>
      <button type="button" data-act="attack">ATTACK</button>
      <button type="button" data-act="dash">DASH</button>
      <button type="button" data-act="parry">PARRY</button>
      <button type="button" data-act="power" id="power-btn" aria-label="Birthsign Power">POWER</button>
    </div>
    <div id="drawer">
      <button type="button" data-act="inventory">PACK</button>
      <button type="button" data-act="skills">SKILLS</button>
      <button type="button" data-act="journal">LOG</button>
      <button type="button" data-act="map">MAP</button>
    </div>
  </div>

  <div id="modal" class="hidden"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
